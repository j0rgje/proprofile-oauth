   <!DOCTYPE html>
   <html>
   <head>
       <title>LinkedIn OAuth Callback</title>
       <meta charset="utf-8">
   </head>
   <body>
       <div style="text-align: center; padding: 50px;">
           <h2>🔗 Verbinding met LinkedIn</h2>
           <p>Je wordt doorgestuurd naar de ProProfile app...</p>
       </div>
       
       <script>
       // Extract OAuth parameters
       const urlParams = new URLSearchParams(window.location.search);
       const code = urlParams.get('code');
       const state = urlParams.get('state');
       const error = urlParams.get('error');
       
       if (error) {
           alert('LinkedIn authenticatie mislukt: ' + error);
       } else if (code) {
           // Redirect to app with authorization code
           const appURL = `proProfile://linkedin-success?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;
           window.location.href = appURL;
           
           // Fallback for browsers that don't support custom schemes
           setTimeout(() => {
               alert('Kon niet automatisch doorsturen naar ProProfile app. Kopieer deze code: ' + code);
           }, 2000);
       }
       </script>
   </body>
   </html>
